# One deploy, whichever the environment: write that environment's settings to
# its App Service app, have the app run the given image, then wait until the
# app answers. Staging and production both deploy through here, so production
# is deployed exactly the way staging was, with its own app and its own secrets.
#
# The caller is already logged in to Azure (azure/login), as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  secret-key:
    description: The environment's own SECRET_KEY.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY.
    required: true
  mistral-api-key:
    description: The environment's own MISTRAL_API_KEY.
    required: true
  posthog-project-token:
    description: The token of the PostHog project the environment reports to.
    required: true
  posthog-environment:
    description: What each error and log line is tagged with, staging or production.
    required: true

runs:
  using: composite
  steps:
    # Written at every deploy, so the GitHub Environment stays the one place a
    # setting is changed. --output none: the command would otherwise print
    # every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000.
    # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
    #   container's own disk, and is seeded again at every start.
    # - RUN_SUMMARIES_DAEMON=1: the container is the only process, so it starts
    #   the summaries daemon itself, as launch.sh did beside the website.
    # - DEFAULT_PROVIDER_*: the seeded provider row keeps its name and points
    #   at Mistral; KEY_ENV is the name of the variable, not the key.
    # - POSTHOG_*: production signals, to PostHog's EU region, tagged with the
    #   environment's name. All three or none, or the app refuses to start.
    - name: Write this environment's settings to its app
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        SECRET_KEY: ${{ inputs.secret-key }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        POSTHOG_PROJECT_TOKEN: ${{ inputs.posthog-project-token }}
        POSTHOG_ENVIRONMENT: ${{ inputs.posthog-environment }}
      run: |
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            AUTH_MODE=dev \
            RUN_SUMMARIES_DAEMON=1 \
            DEFAULT_PROVIDER_API_TYPE=openai \
            DEFAULT_PROVIDER_BASE_URL=https://api.mistral.ai/v1 \
            DEFAULT_PROVIDER_MODEL=ministral-14b-latest \
            DEFAULT_PROVIDER_KEY_ENV=MISTRAL_API_KEY \
            POSTHOG_HOST=https://eu.i.posthog.com \
            "POSTHOG_ENVIRONMENT=$POSTHOG_ENVIRONMENT" \
            "SECRET_KEY=$SECRET_KEY" \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "MISTRAL_API_KEY=$MISTRAL_API_KEY" \
            "POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN"

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Run the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$running" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $running, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME now runs $IMAGE"

    # /dev/login answers 200 without a session once the app has started and
    # seeded. The limit is the one upstream measured on its own plan
    # (EPF-MDE/OceENS#169), not yet measured on this one.
    - name: Wait until the app answers
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: |
        url="https://$APP_NAME.azurewebsites.net/dev/login"
        limit=700
        start=$(date +%s)
        while true; do
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$status" = 200 ]; then
            echo "$url answers 200, ${elapsed} s after the image was set"
            exit 0
          fi
          echo "${elapsed} s: $url answered ${status:-nothing}, waiting for 200"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
