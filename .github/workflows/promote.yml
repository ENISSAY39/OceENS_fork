# The Promotion: production receives the image of staging's last green deploy.
# Started by hand only, never by a push or a schedule, and it builds nothing,
# so production only ever runs an image whose deploy to staging passed.
name: promote

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # It reads the `architecture` workflow's runs, not the staging app. A deploy
  # sets the image before it waits for the app to answer, so after a failed
  # deploy the app is still set to the image that never answered. That image
  # is never promoted. Reading runs needs no Azure login, only `actions: read`.
  last-green-staging:
    name: find staging's last green deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      image: ${{ steps.find.outputs.image }}
    steps:
      # The push runs on the default branch, newest first. The first one whose
      # `deploy to staging` job passed built and deployed the image tagged with
      # its commit. Every run before it is logged as skipped: a red check, a
      # failed deploy, or a deploy still running. With no such run, nothing is
      # promoted. Only the newest 100 push runs are read. `deploy to staging`
      # is the job's name in architecture.yml: renaming it there means renaming
      # it here too.
      - name: Find the last run whose deploy to staging passed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runs=$(gh run list --workflow architecture.yml --branch "$DEPLOY_BRANCH" --event push --limit 100 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          while read -r run sha; do
            [ -n "$run" ] || continue
            deploy=$(gh run view "$run" --json jobs --jq '.jobs[] | select(.name == "deploy to staging") | .conclusion')
            if [ "$deploy" = success ]; then
              image="ghcr.io/${GITHUB_REPOSITORY,,}:$sha"
              echo "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, commit $sha: deploy to staging passed"
              echo "Promoting $image"
              echo "image=$image" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Run $run, commit $sha: deploy to staging ${deploy:-has no result}, skipped"
          done <<< "$runs"
          echo "No push run on $DEPLOY_BRANCH has a deploy to staging that passed: nothing to promote" >&2
          exit 1

  # Deploys that same image to production. Nothing is rebuilt; only
  # production's own app, settings and secrets differ.
  promote-production:
    name: promote to production
    needs: last-green-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One deploy at a time, in the order started.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      # For the deploy action only: nothing is built from this checkout.
      - uses: actions/checkout@v7.0.1

      # An empty DEV_LOGIN_KEY would open the sign-in to anyone who has the URL,
      # so a missing setting stops the job before anything is deployed.
      - name: Check that the production Environment is filled in
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP \
            AZURE_WEBAPP_NAME SECRET_KEY DEV_LOGIN_KEY MISTRAL_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is not set in the production Environment" >&2
              missing=1
            fi
          done
          exit "$missing"

      # OpenID Connect, as the production Environment: no Azure password is stored.
      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy that image to production
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ needs.last-green-staging.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          secret-key: ${{ secrets.SECRET_KEY }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
