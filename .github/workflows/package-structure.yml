# Package structure: no private name crosses a package boundary (tach), and no
# two packages import each other (scripts/check_cycles.py). See
# src/oceens/README.md for the rule.
name: Package structure

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The Python version comes from .python-version, the tools from uv.lock.
      - run: uv sync --locked

      - name: Interfaces (tach check)
        run: uv run tach check

      - name: Import cycles between packages
        run: uv run python scripts/check_cycles.py
