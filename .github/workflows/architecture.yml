name: architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run tach check
      - run: uv run python scripts/check_cycles.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest

  # A push to the default branch whose checks all pass is built into one image,
  # tagged with its commit, and deployed to staging. Never on a pull request.
  deploy-staging:
    name: deploy to staging
    needs: [architecture, test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time, in the order pushed.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7.0.1

      # An empty DEV_LOGIN_KEY would open the sign-in to anyone who has the URL,
      # so a missing setting stops the job before anything is built or deployed.
      - name: Check that the staging Environment is filled in
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP \
            AZURE_WEBAPP_NAME SECRET_KEY DEV_LOGIN_KEY MISTRAL_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is not set in the staging Environment" >&2
              missing=1
            fi
          done
          exit "$missing"

      # One image per commit: a commit already pushed to the registry is not
      # built again, so a re-run deploys the image the first run built.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # OpenID Connect, as the staging Environment: no Azure password is stored.
      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Written at every deploy, so the GitHub Environment stays the one place a
      # setting is changed. --output none: the command would otherwise print
      # every setting back, secrets included.
      #
      # - WEBSITES_PORT: uvicorn listens on 8000.
      # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
      #   container's own disk, and is seeded again at every start.
      # - RUN_SUMMARIES_DAEMON=1: the container is the only process, so it starts
      #   the summaries daemon itself, as launch.sh did beside the website.
      # - DEFAULT_PROVIDER_*: the seeded provider row keeps its name and points
      #   at Mistral; KEY_ENV is the name of the variable, not the key.
      - name: Write staging's settings to its app
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --settings \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              AUTH_MODE=dev \
              RUN_SUMMARIES_DAEMON=1 \
              DEFAULT_PROVIDER_API_TYPE=openai \
              DEFAULT_PROVIDER_BASE_URL=https://api.mistral.ai/v1 \
              DEFAULT_PROVIDER_MODEL=ministral-14b-latest \
              DEFAULT_PROVIDER_KEY_ENV=MISTRAL_API_KEY \
              "SECRET_KEY=$SECRET_KEY" \
              "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
              "MISTRAL_API_KEY=$MISTRAL_API_KEY"

      # The image is public on GHCR, so the app pulls it without credentials.
      - name: Run the image on staging
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --container-image-name "$IMAGE"
          running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
          if [ "$running" != "DOCKER|$IMAGE" ]; then
            echo "$APP_NAME is set to $running, not $IMAGE" >&2
            exit 1
          fi
          echo "$APP_NAME now runs $IMAGE"

      # /dev/login answers 200 without a session once the app has started and
      # seeded. The limit is the one upstream measured on its own plan
      # (EPF-MDE/OceENS#169), not yet measured on this one.
      - name: Wait until the app answers
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          url="https://$APP_NAME.azurewebsites.net/dev/login"
          limit=700
          start=$(date +%s)
          while true; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            elapsed=$(( $(date +%s) - start ))
            if [ "$status" = 200 ]; then
              echo "$url answers 200, ${elapsed} s after the image was set"
              exit 0
            fi
            echo "${elapsed} s: $url answered ${status:-nothing}, waiting for 200"
            if [ "$elapsed" -ge "$limit" ]; then
              echo "$url did not answer 200 within $limit s" >&2
              exit 1
            fi
            sleep 15
          done
