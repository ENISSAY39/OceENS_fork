services:
  oceens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dans le conteneur, la base est toujours dans le volume ci-dessous.
      # LOCAL_DATABASE_DIR, lu dans .env, choisit seulement le dossier de
      # l'hôte monté : sans cette ligne, env_file le passerait aussi au
      # conteneur, qui écrirait hors du volume.
      LOCAL_DATABASE_DIR: /app/database
    volumes:
      - ${LOCAL_DATABASE_DIR:-./database}:/app/database
      - ./src/oceens/import:/app/src/oceens/import
    restart: always
